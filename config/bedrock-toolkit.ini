; Local toolkit settings. Except for [fps_counter], restart the module to apply changes.

[Compatibility]
; Experimental: bypass exact package/version identity gates only. Feature profiles remain mandatory.
AllowUnsupportedGameVersion=false
[Zoom]
FirstPersonFov=25
ThirdPersonFov=29
; Transition duration in milliseconds (1-10000; lower is faster).
TransitionDurationMs=75
; Zoom sensitivity multiplier at the minimum FOV (1 degree), on a 0-100 scale.
; 100 uses the full sensitivity calculated by the scaling curve.
MouseSensitivity=45
; Strength of sensitivity reduction as FOV narrows (1-2, decimals allowed).
; 1 uses the original optical curve. Higher values give finer control at deep Zoom.
SensitivityScalingStrength=1.5

[Shortcuts]
Zoom=T
Nametag=F7
AlwaysDay=F6
FullBright=F8
StatusIndicator=F9
SafeDetach=F10

[nametag]
; Keep only the local player's name visible in third person when F1 hides the HUD.
; false preserves Minecraft's native HUD-hidden suppression. Restart the module to apply.
show_when_hud_hidden=true

[fps_counter]
; Bottom-left game updates per second. Save these settings to apply without restarting.
enabled=true
; Text size in pixels (12-48).
font_size=28
