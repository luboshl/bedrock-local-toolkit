name: Build and draft release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override; leave empty to use the next patch version
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -Test

      - name: Determine and create release tag
        id: release-tag
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              if ($env:GITHUB_REF -ne 'refs/heads/main') {
                  throw 'Run this workflow from the main branch.'
              }

              git fetch --force origin '+refs/tags/*:refs/tags/*'
              if ($LASTEXITCODE -ne 0) {
                  throw 'Could not fetch release tags from origin.'
              }

              $releaseTags = @(git tag --merged HEAD --list 'v[0-9]*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
              $latestVersion = [version]'0.0.0'
              foreach ($releaseTag in $releaseTags) {
                  $tagVersion = [version]$releaseTag.Substring(1)
                  if ($tagVersion -gt $latestVersion) {
                      $latestVersion = $tagVersion
                  }
              }

              $suggestedVersion = '{0}.{1}.{2}' -f $latestVersion.Major, $latestVersion.Minor, ($latestVersion.Build + 1)
              $version = $env:REQUESTED_VERSION
              if ([string]::IsNullOrWhiteSpace($version)) {
                  $version = $suggestedVersion
              }
              else {
                  $version = $version.Trim()
              }

              if ($version -notmatch '^\d+\.\d+\.\d+$') {
                  throw "Invalid version '$version'. Use MAJOR.MINOR.PATCH format, for example $suggestedVersion."
              }

              $tag = "v$version"
              git show-ref --verify --quiet "refs/tags/$tag"
              if ($LASTEXITCODE -eq 0) {
                  throw "Tag '$tag' already exists."
              }

              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a $tag -m $tag
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not create tag '$tag'."
              }

              git push origin $tag
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not push tag '$tag'."
              }

              Write-Host "Using release version $version (next patch suggestion: $suggestedVersion)."
          }
          else {
              $tag = $env:GITHUB_REF_NAME
              if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
                  throw "Release tag must use vMAJOR.MINOR.PATCH format: $tag"
              }
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package and create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG

          $licenseDirectory = Join-Path 'artifacts\launcher' 'licenses'
          New-Item -ItemType Directory -Path $licenseDirectory -Force | Out-Null
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $licenseDirectory 'bedrock-local-toolkit-MIT.txt')
          Copy-Item -LiteralPath 'GameMod\vendor\minhook\LICENSE.txt' -Destination (Join-Path $licenseDirectory 'MinHook.txt')

          $archive = Join-Path $env:RUNNER_TEMP "bedrock-local-toolkit-$tag-win-x64.zip"
          Compress-Archive -Path 'artifacts\launcher\*' -DestinationPath $archive -CompressionLevel Optimal

          & gh release create $tag $archive --draft --generate-notes --title $tag
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft GitHub Release for $tag."
          }
